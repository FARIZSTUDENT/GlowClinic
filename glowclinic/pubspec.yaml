
name: glowclinic
description: GlowClinic skin-care clinic demo application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  crypto: ^3.0.6
  flutter_local_notifications: ^19.4.0
  flutter_map: ^8.2.1
  flutter_secure_storage: ^9.2.4
  geolocator: ^14.0.2
  http: ^1.5.0
  image_picker: ^1.2.0
  latlong2: ^0.9.1
  light: ^4.0.0
  local_auth: ^2.3.0
  path: ^1.9.1
  path_provider: ^2.1.5
  qr_flutter: ^4.1.0
  sensors_plus: ^6.1.1
  sqflite: ^2.4.2
  timezone: ^0.10.1
  url_launcher: ^6.3.1
  supabase_flutter: ^2.18.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/treatment/
